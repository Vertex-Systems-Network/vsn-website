name: Visual Browser QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'services.html'
      - 'about.html'
      - 'blog.html'
      - 'projects.html'
      - 'contact.html'
      - 'web-development-ecommerce.html'
      - 'blog-detail.html'
      - 'project-detail.html'
      - '404.html'
      - 'coming-soon.html'
      - 'assets/**'
      - 'scripts/visual_browser_qa.cjs'
      - '.github/workflows/visual-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Playwright for QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render primary, detail and utility pages
        run: node scripts/visual_browser_qa.cjs
      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-browser-pages
          path: qa-artifacts/pages
          if-no-files-found: error
          retention-days: 7
