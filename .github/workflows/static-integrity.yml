name: Static Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    name: static-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Python
        run: python3 --version

      - name: Validate static website
        run: python3 scripts/validate_static_site.py

      - name: Validate motion behavior
        run: node scripts/check_motion_behavior.cjs

      - name: Validate Ritovex fidelity
        run: node scripts/check_ritovex_fidelity.cjs
