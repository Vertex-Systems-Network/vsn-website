name: Deploy Production to Middlehost

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-PRODUCTION to publish main to vertexsystemsnetwork.com'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vsn-production-middlehost
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ inputs.confirm == 'DEPLOY-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_ORIGIN: https://vertexsystemsnetwork.com
      SSH_HOST: ${{ secrets.MIDDLEHOST_SSH_HOST }}
      SSH_PORT: ${{ secrets.MIDDLEHOST_SSH_PORT }}
      SSH_USER: ${{ secrets.MIDDLEHOST_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.MIDDLEHOST_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.MIDDLEHOST_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.MIDDLEHOST_DEPLOY_PATH }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Require main and deployment confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm }}" = "DEPLOY-PRODUCTION"

      - name: Validate required Middlehost secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment secret: $name"
              exit 1
            fi
          done
          case "$SSH_PORT" in
            *[!0-9]*|'') echo "SSH port must be numeric"; exit 1 ;;
          esac
          case "$DEPLOY_PATH" in
            /home/*/public_html|/home/*/public_html/) ;;
            *) echo "Refusing unsafe deploy path: expected /home/<cpanel-user>/public_html"; exit 1 ;;
          esac

      - name: Validate website source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_logo_palette.py
          python3 scripts/validate_static_site.py
          node scripts/check_state_consistency.cjs
          node scripts/check_motion_behavior.cjs
          node scripts/check_ritovex_fidelity.cjs

      - name: Build clean release directory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release_bundle.py
          sha256sum dist/vsn-website-release.zip

      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/middlehost_key"
          chmod 600 "$HOME/.ssh/middlehost_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify remote document root
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/middlehost_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"

      - name: Preview production synchronization
        shell: bash
        run: |
          set -euo pipefail
          rsync -azn --delete-after --itemize-changes \
            --exclude '.well-known/acme-challenge/***' \
            --exclude 'cgi-bin/***' \
            --exclude 'release-manifest.json' \
            --exclude 'SHA256SUMS.txt' \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i $HOME/.ssh/middlehost_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/vsn-website/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Publish production runtime
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete-after --checksum \
            --exclude '.well-known/acme-challenge/***' \
            --exclude 'cgi-bin/***' \
            --exclude 'release-manifest.json' \
            --exclude 'SHA256SUMS.txt' \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i $HOME/.ssh/middlehost_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/vsn-website/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Live production smoke checks
        shell: bash
        run: |
          set -euo pipefail
          for path in / /services.html /contact.html /blog.html /projects.html /profile.html; do
            echo "Checking $PRODUCTION_ORIGIN$path"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              --max-time 25 "$PRODUCTION_ORIGIN$path" -o /tmp/page.html
            grep -qi 'Vertex Systems Network\|VSN' /tmp/page.html
          done
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --max-time 25 "$PRODUCTION_ORIGIN/assets/vertex-logo.png" -o /tmp/vertex-logo.png
          test -s /tmp/vertex-logo.png

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '## VSN production deployment'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Origin: $PRODUCTION_ORIGIN"
            echo '- Target: Middlehost cPanel public_html via SSH/SFTP'
            echo '- Source: validated deterministic release directory'
            echo '- Live smoke checks: passed'
          } >> "$GITHUB_STEP_SUMMARY"
